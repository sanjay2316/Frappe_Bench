<h3>Details Report</h3>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Name 1</th>
            <th>Status</th>
            <th>Amount</th>
        </tr>
    </thead>

    <tbody>
        <% for (var i = 0; i < data.length; i++) { %>
            <tr>
                <td><%= data[i].name %></td>
                <td><%= data[i].name1 %></td>
                <td><%= data[i].status %></td>
                <td><%= format_money(data[i].amount) %></td>
            </tr>
        <% } %>
    </tbody>
</table>
